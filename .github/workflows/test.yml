# 品番の読み取りの見本（tests/work-id.test.js）を、PR と main への反映のたびに確かめる
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  work-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 構文チェック
        run: node --check pikpak-distill.user.js
      - name: 品番の読み取りの見本
        run: node tests/work-id.test.js
