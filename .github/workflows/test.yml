# 品番の読み取りの見本（tests/work-id.test.js）と画面の試験（tests/e2e）を、PR と main への反映のたびに確かめる
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  work-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 構文チェック
        run: node --check pikpak-distill.user.js
      - name: 品番の読み取りの見本
        run: node tests/work-id.test.js

  e2e:
    # 画面の試験（PikPak の画面と API を模した中でスクリプトを動かす）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 試験の道具を入れる
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 画面の試験
        run: node tests/e2e/run.js
      - name: 失敗したときのスクリーンショット
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/
          if-no-files-found: ignore
